  <path d="M322 150 L312 326" stroke="#c98a3e" stroke-width="16" stroke-linecap="round"/>
  <path d="M322 150 L312 326" stroke="#f3c27a" stroke-width="8" stroke-linecap="round" opacity=".8"/>
