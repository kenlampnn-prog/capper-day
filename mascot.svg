  <!-- gloves -->
  <circle cx="84" cy="214" r="26" fill="url(#glove)"/>
  <circle cx="318" cy="232" r="26" fill="url(#glove)"/>
  <path d="M68 202 q14 -8 30 0" stroke="#fff" stroke-width="4" opacity=".5" fill="none" stroke-linecap="round"/>
  <path d="M302 220 q14 -8 30 0" stroke="#fff" stroke-width="4" opacity=".5" fill="none" stroke-linecap="round"/>
</svg>
