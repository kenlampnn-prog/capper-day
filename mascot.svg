<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="puckSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f3a"/><stop offset=".45" stop-color="#4a5163"/><stop offset="1" stop-color="#22252e"/>
    </linearGradient>
    <radialGradient id="puckTop" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#5d6579"/><stop offset="1" stop-color="#30343f"/>
    </radialGradient>
    <radialGradient id="helmet" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#9fdcff"/><stop offset=".55" stop-color="#4fb0ee"/><stop offset="1" stop-color="#2b86c8"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#f07a2a"/>
    </linearGradient>
    <radialGradient id="glove" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ff9a8a"/><stop offset="1" stop-color="#e2554a"/>
    </radialGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c27a"/><stop offset="1" stop-color="#c98a3e"/>
    </linearGradient>
    <radialGradient id="eye" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef5"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1d3a5c" stop-opacity=".28"/><stop offset="1" stop-color="#1d3a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="200" cy="352" rx="150" ry="22" fill="url(#shadow)"/>
  <!-- legs + skates -->
  <rect x="150" y="285" width="26" height="40" rx="12" fill="#30343f"/>
  <rect x="224" y="285" width="26" height="40" rx="12" fill="#30343f"/>
  <path d="M132 318 q0 -14 16 -14 h30 q12 0 12 14 v10 h-58 z" fill="#fffaf2"/>
  <path d="M210 318 q0 -14 16 -14 h30 q12 0 12 14 v10 h-58 z" fill="#fffaf2"/>
  <rect x="128" y="332" width="66" height="6" rx="3" fill="#aab4c3"/>
  <rect x="206" y="332" width="66" height="6" rx="3" fill="#aab4c3"/>
  <rect x="146" y="326" width="6" height="8" fill="#aab4c3"/><rect x="176" y="326" width="6" height="8" fill="#aab4c3"/>
  <rect x="224" y="326" width="6" height="8" fill="#aab4c3"/><rect x="254" y="326" width="6" height="8" fill="#aab4c3"/>
  <!-- puck body -->
  <path d="M90 175 v95 a110 34 0 0 0 220 0 v-95 z" fill="url(#puckSide)"/>
  <ellipse cx="200" cy="175" rx="110" ry="34" fill="url(#puckTop)"/>
  <path d="M96 268 a104 30 0 0 0 208 0" fill="none" stroke="#5f6779" stroke-width="3" opacity=".6"/>
  <!-- helmet -->
  <path d="M100 168 q0 -96 100 -98 q100 2 100 98 q-100 22 -200 0 z" fill="url(#helmet)"/>
  <path d="M104 146 q96 20 192 0 l3 20 q-99 22 -198 0 z" fill="url(#stripe)"/>
  <ellipse cx="160" cy="104" rx="26" ry="12" fill="#ffffff" opacity=".45" transform="rotate(-20 160 104)"/>
  <!-- face -->
  <ellipse cx="160" cy="215" rx="27" ry="31" fill="url(#eye)"/>
  <ellipse cx="240" cy="215" rx="27" ry="31" fill="url(#eye)"/>
  <circle cx="166" cy="221" r="15" fill="#3a2a1e"/><circle cx="234" cy="221" r="15" fill="#3a2a1e"/>
  <circle cx="166" cy="221" r="8" fill="#140d08"/><circle cx="234" cy="221" r="8" fill="#140d08"/>
  <circle cx="171" cy="214" r="5" fill="#fff"/><circle cx="239" cy="214" r="5" fill="#fff"/>
  <path d="M136 180 q22 -12 44 -2" stroke="#1d1f26" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M220 178 q22 -10 44 2" stroke="#1d1f26" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="128" cy="256" rx="14" ry="8" fill="#ff8a8a" opacity=".55"/>
  <ellipse cx="272" cy="256" rx="14" ry="8" fill="#ff8a8a" opacity=".55"/>
